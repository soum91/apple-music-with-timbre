name: Build Apple Music + Timbre (cached Gecko)
on:
  push:
    branches: [main]
    paths:
      - 'AppleMusicGecko/**'
      - 'version-ui-contract.json'
      - '.github/workflows/timbre-radio.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: timbre-radio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      REYNARD_REF: 55eecc5b63114b0072bf14bd4c55acec01e3a40a
      XCODE_VERSION: '26.5'
      FIREFOX_IPA: https://github.com/soum91/firefox-gecko-ios/releases/download/native-gecko-159.0-build-65/Firefox-Gecko-Native-159.0-build-65.ipa
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source contract
        run: python3 scripts/check_version_ui.py
      - name: Checkout pinned Gecko sources for header compatibility
        uses: actions/checkout@v4
        with:
          repository: soum91/reynard-browser
          ref: ${{ env.REYNARD_REF }}
          path: reynard-source
          persist-credentials: false
      - name: Checkout engine cache scripts
        uses: actions/checkout@v4
        with:
          repository: soum91/firefox-gecko-ios
          ref: firefox-native-gecko
          path: firefox-source
          persist-credentials: false
      - name: Select matching Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Fetch verified Firefox Gecko runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firefox-package"
          curl -fL --retry 4 --retry-all-errors -o "$RUNNER_TEMP/firefox-package/firefox.ipa" "$FIREFOX_IPA"
          unzip -tq "$RUNNER_TEMP/firefox-package/firefox.ipa" >/dev/null
          mkdir -p AppleMusicGecko/Dependencies
          unzip -q "$RUNNER_TEMP/firefox-package/firefox.ipa" 'Payload/Firefox.app/Frameworks/GeckoView.framework/*' -d "$RUNNER_TEMP/firefox-package"
          cp -R "$RUNNER_TEMP/firefox-package/Payload/Firefox.app/Frameworks/GeckoView.framework" AppleMusicGecko/Dependencies/
          test -f AppleMusicGecko/Dependencies/GeckoView.framework/Modules/GeckoView.swiftmodule/arm64-apple-ios.swiftmodule
      - name: Restore existing Gecko engine headers (never recompile)
        run: |
          set -euo pipefail
          key="gecko-engine-v2-${REYNARD_REF}-xcode${XCODE_VERSION}"
          content=$(bash firefox-source/.github/scripts/gecko-engine-key.sh reynard-source '--use-sccache --auto-clobber')
          mkdir -p "$RUNNER_TEMP/gecko-engine"
          GITHUB_REPOSITORY=soum91/firefox-gecko-ios \
            bash firefox-source/.github/scripts/fetch-gecko-engine.sh "$key" "$REYNARD_REF" "$RUNNER_TEMP/gecko-engine" "$content"
          archive="$RUNNER_TEMP/gecko-engine/gecko-engine-dist.tar.gz"
          test -s "$archive" || { echo '::error::Compiled Gecko engine cache unavailable; refusing source rebuild'; exit 1; }
          obj="$GITHUB_WORKSPACE/reynard-source/engine/firefox/obj-aarch64-apple-ios"
          mkdir -p "$obj"
          tar -xzf "$archive" -C "$obj"
          test -d "$obj/dist/include"
      - name: Build native-UI wrapper with cached Gecko
        working-directory: AppleMusicGecko
        run: |
          set -euo pipefail
          brew install xcodegen
          swift ../AppleMusicTimbre/scripts/icon.swift "$PWD"
          xcodegen generate
          gecko_flags=$(bash "$GITHUB_WORKSPACE/firefox-source/.github/scripts/geckoview-client-swift-flags.sh" "$GITHUB_WORKSPACE/reynard-source")
          xcodebuild -project AppleMusicGecko.xcodeproj -scheme AppleMusicGecko -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/timbre-radio" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            OTHER_SWIFT_FLAGS='$(inherited)'" $gecko_flags" \
            build | tee "$RUNNER_TEMP/timbre-radio-build.log"
      - name: Package Gecko with native UI and built-in Timbre
        run: |
          set -euo pipefail
          python3 AppleMusicGecko/scripts/package_gecko.py \
            --firefox-ipa "$RUNNER_TEMP/firefox-package/firefox.ipa" \
            --app "$RUNNER_TEMP/timbre-radio/Build/Products/Release-iphoneos/AppleMusicGecko.app" \
            --output "$RUNNER_TEMP/Apple-Music-Timbre-Gecko-0.2.1-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Music-Timbre-Gecko-0.2.1-unsigned
          path: ${{ runner.temp }}/Apple-Music-Timbre-Gecko-0.2.1-unsigned.ipa
          if-no-files-found: error
      - name: Publish test prerelease with factual notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apple-music-timbre-gecko-v0.2.1-b3 "$RUNNER_TEMP/Apple-Music-Timbre-Gecko-0.2.1-unsigned.ipa" \
            --prerelease --title 'Apple Music + Timbre 0.2.1 (DRM diagnostics)' \
            --notes 'Added a one-tap Gecko protected-media support check through the Shaka Player browser test. Corrected the Playback and status screens: iPhone testing shows Timbre affects Apple Music previews, but paid tracks still stop at about 90 seconds in Gecko while Safari plays full songs. This build does not claim to fix full-track playback or Radio; both remain open. The existing cached Gecko engine and Timbre package are unchanged. IPA is unsigned and needs nested code signed consistently.'
      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timbre-radio-build-log
          path: ${{ runner.temp }}/timbre-radio-build.log
          if-no-files-found: ignore
