name: Build Apple Music + Timbre IPA
on:
  push:
    branches: [main]
    paths: ['AppleMusicTimbre/**', '.github/workflows/standalone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate icon and Xcode project
        working-directory: AppleMusicTimbre
        run: |
          swift scripts/icon.swift "$PWD"
          xcodegen generate
      - name: Build device app
        working-directory: AppleMusicTimbre
        run: |
          set -o pipefail
          xcodebuild -project AppleMusicTimbre.xcodeproj -scheme AppleMusicTimbre -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package unsigned IPA
        working-directory: AppleMusicTimbre
        run: |
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/AppleMusicTimbre.app output/Payload/
          cd output
          ditto -c -k --sequesterRsrc --keepParent Payload Apple-Music-Timbre-0.3.0-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-Music-Timbre-0.3.0-unsigned
          path: AppleMusicTimbre/output/*.ipa
          if-no-files-found: error
      - name: Upload compiler log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-log
          path: AppleMusicTimbre/build.log
