name: AppleMusicTimbre
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '3'
targets:
  AppleMusicTimbre:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.applemusictimbre
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: '3'
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Apple Music + Timbre
        CFBundleShortVersionString: '0.3.0'
        CFBundleVersion: '3'
        NSAppleMusicUsageDescription: Browse your library and play Apple Music tracks you choose.
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
schemes:
  AppleMusicTimbre:
    build:
      targets:
        AppleMusicTimbre: all
