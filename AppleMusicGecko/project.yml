name: AppleMusicGecko
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.9'
    CURRENT_PROJECT_VERSION: '11'
    FRAMEWORK_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/Dependencies'
    OTHER_LDFLAGS: '$(inherited) -framework GeckoView'
targets:
  AppleMusicGecko:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Resources/drm-diagnostic.html
        buildPhase: resources
      - path: Resources/audio-output-test.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.applemusictimbre.gecko
        MARKETING_VERSION: '0.2.9'
        CURRENT_PROJECT_VERSION: '11'
        SWIFT_OBJC_BRIDGING_HEADER: '$(PROJECT_DIR)/Sources/NativeAudioProbe.h'
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: Dependencies/GeckoView.framework
        embed: false
      - target: TimbreSafariExtension
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Apple Music + Timbre
        CFBundleShortVersionString: '0.2.9'
        CFBundleVersion: '11'
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: "Play your Apple Music subscription tracks and radio through Apple's native MusicKit player."
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: '$(PRODUCT_MODULE_NAME).TimbreSceneDelegate'
  TimbreSafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - SafariExtension/SafariWebExtensionHandler.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.applemusictimbre.gecko.safari
        PRODUCT_NAME: TimbreSafariExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_LDFLAGS: ''
        MARKETING_VERSION: '0.2.9'
        CURRENT_PROJECT_VERSION: '11'
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Timbre EQ for Safari
        CFBundleShortVersionString: '0.2.9'
        CFBundleVersion: '11'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: '$(PRODUCT_MODULE_NAME).SafariWebExtensionHandler'
    preBuildScripts:
      - name: Stage Safari Timbre WebExtension
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          python3 "$SRCROOT/scripts/stage_safari_extension.py" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --timbre-root "$SRCROOT/../timbre-source"
schemes:
  AppleMusicGecko:
    build:
      targets:
        AppleMusicGecko: all
