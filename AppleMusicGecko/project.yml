name: TimbreRadio
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    FRAMEWORK_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/Dependencies'
    OTHER_LDFLAGS: '$(inherited) -framework GeckoView'
targets:
  TimbreRadio:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.timbreradio
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - framework: Dependencies/GeckoView.framework
        embed: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Timbre Radio
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: '$(PRODUCT_MODULE_NAME).TimbreSceneDelegate'
schemes:
  TimbreRadio:
    build:
      targets:
        TimbreRadio: all
