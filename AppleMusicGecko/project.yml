name: AppleMusicGecko
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.1'
    CURRENT_PROJECT_VERSION: '3'
    FRAMEWORK_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/Dependencies'
    OTHER_LDFLAGS: '$(inherited) -framework GeckoView'
targets:
  AppleMusicGecko:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.applemusictimbre.gecko
        MARKETING_VERSION: '0.2.1'
        CURRENT_PROJECT_VERSION: '3'
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: Dependencies/GeckoView.framework
        embed: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Apple Music + Timbre
        CFBundleShortVersionString: '0.2.1'
        CFBundleVersion: '3'
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: '$(PRODUCT_MODULE_NAME).TimbreSceneDelegate'
schemes:
  AppleMusicGecko:
    build:
      targets:
        AppleMusicGecko: all
